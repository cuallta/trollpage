<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gotcha</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --accent: #c8102e;
    --muted: #666;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414;
      --text: #f2f2f2;
      --muted: #aaa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414;
    --text: #f2f2f2;
    --muted: #aaa;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    max-width: 480px;
  }
  h1 {
    font-size: clamp(22px, 5vw, 32px);
    margin-bottom: 8px;
  }
  h3 {
    color: var(--accent);
    font-size: clamp(16px, 4vw, 20px);
    margin: 0 0 16px;
  }
  p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
  }
  .countdown {
    margin-top: 28px;
    font-size: 14px;
    color: var(--muted);
  }
  .bar {
    margin-top: 10px;
    height: 6px;
    width: 100%;
    background: rgba(128,128,128,0.25);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width linear;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Congratulations!</h1>
    <h3>Ryan pwned your PC</h3>
    <p>Lol u got phished and now you have to watch Szobo's free kick again</p>
    <div class="countdown" id="countdown">Redirecting in <span id="n">4</span>s</div>
    <div class="bar"><div class="bar-fill" id="fill"></div></div>
    <button id="go" style="display:none;margin-top:20px;padding:12px 24px;font-size:15px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;">Continue</button>
  </div>

<script>
  var seconds = 4;
  var n = document.getElementById('n');
  var fill = document.getElementById('fill');
  fill.style.transitionDuration = (seconds) + 's';
  requestAnimationFrame(function() { fill.style.width = '100%'; });

  var target = "https://www.youtube.com/shorts/T_WJm4Gn9hI";
  var countdownEl = document.getElementById('countdown');
  var btn = document.getElementById('go');

  var interval = setInterval(function() {
    seconds -= 1;
    n.textContent = Math.max(seconds, 0);
    if (seconds <= 0) {
      clearInterval(interval);
      // Try an automatic redirect first.
      window.location.href = target;
      // Fallback: some browsers block auto-redirects from embedded pages,
      // so surface a button the user can click.
      setTimeout(function() {
        countdownEl.textContent = "Tap below if it didn't redirect:";
        btn.style.display = 'inline-block';
      }, 400);
    }
  }, 1000);

  btn.addEventListener('click', function() {
    window.location.href = target;
  });
</script>
</body>
</html>
